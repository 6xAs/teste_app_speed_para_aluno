<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Entrar • Speed App</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9efff;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 0%,#23356b 0,transparent 42%),radial-gradient(ellipse at 100% 100%,#222054 0,transparent 38%),#0b1020}.layout{width:min(100%,430px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;justify-content:center;font-size:19px;font-weight:800;letter-spacing:-.5px}.brand-icon{height:39px;width:39px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#6b8bff,#8868e9);box-shadow:0 12px 28px #6756ff44;font-size:20px}main{background:rgba(17,25,47,.88);border:1px solid #ffffff1c;border-radius:24px;padding:36px;box-shadow:0 24px 75px #0006;backdrop-filter:blur(18px)}h1{font-size:27px;letter-spacing:-1px;margin:0 0 8px}p{margin:0 0 28px;color:#9daac7;font-size:14px;line-height:1.6}label{display:block;font-weight:650;font-size:13px;margin:0 0 9px}.field{margin-bottom:20px}input{height:50px;width:100%;border:1px solid #3b4765;background:#0e162c;color:white;border-radius:12px;padding:0 15px;font:inherit;outline:none;transition:border .18s,box-shadow .18s}input::placeholder{color:#7885a4}input:focus{border-color:#8497ff;box-shadow:0 0 0 3px #7289ff30}.password-wrap{position:relative}.password-wrap input{padding-right:65px}.toggle{position:absolute;right:10px;top:8px;background:none;border:0;color:#b3c3e7;cursor:pointer;font-size:12px;padding:9px}button[type=submit]{width:100%;height:51px;border:0;border-radius:12px;background:linear-gradient(95deg,#6987ff,#8265e9);color:white;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 12px 25px #615cdb38;transition:transform .15s,filter .15s}button[type=submit]:hover{filter:brightness(1.12);transform:translateY(-1px)}button[type=submit]:focus-visible,.toggle:focus-visible{outline:3px solid #b2c2ff;outline-offset:3px}.message{margin-top:17px;color:#ffdc96;background:#ffb42e12;border:1px solid #ffb42e35;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}.message[hidden]{display:none}.foot{text-align:center;color:#8290b1;font-size:12px;margin-top:24px}@media(max-width:460px){main{padding:28px 23px}h1{font-size:25px}}
</style></head><body><div class="layout"><div class="brand"><div class="brand-icon" aria-hidden="true">⚡</div><span>Speed App</span></div><main><h1>Bem-vindo de volta</h1><p>Informe suas credenciais para acessar sua conta.</p><form id="login"><div class="field"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required placeholder="Digite seu usuário" maxlength="120"></div><div class="field"><label for="password">Senha</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"><button class="toggle" id="toggle" type="button" aria-label="Mostrar senha">Mostrar</button></div></div><button type="submit">Entrar</button><div id="message" class="message" role="status" aria-live="polite" hidden></div></form></main><div class="foot">Ambiente de demonstração • Node.js + Vercel</div></div><script>
const form=document.getElementById('login'),message=document.getElementById('message'),password=document.getElementById('password'),toggle=document.getElementById('toggle');
toggle.addEventListener('click',()=>{const shown=password.type==='text';password.type=shown?'password':'text';toggle.textContent=shown?'Mostrar':'Ocultar';toggle.setAttribute('aria-label',shown?'Mostrar senha':'Ocultar senha')});
form.addEventListener('submit',event=>{event.preventDefault();message.textContent='Tela de login pronta. A autenticação ainda não foi configurada; nenhuma credencial foi enviada ou armazenada.';message.hidden=false;password.value=''});
</script></body></html>
